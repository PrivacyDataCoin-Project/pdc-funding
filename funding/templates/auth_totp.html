{% extends "base.html" %}
{% block title %}Authenticator · {{ site_name }}{% endblock %}
{% block body %}
<section class="auth-box panel">
  <h1>Authenticator code</h1>
  <p class="lede">Enter the 6-digit code from your authenticator app.</p>
  <form method="post" action="/login/2fa">
    <label for="code">One-time code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" required autofocus placeholder="123456">
    <button class="btn" type="submit">Verify</button>
  </form>
  <p class="stat-sub" style="margin-top:1rem"><a href="/login">Back to log in</a></p>
</section>
{% endblock %}
